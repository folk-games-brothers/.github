name: check-prs-description

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: read

jobs:
  check-prs-description:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR description
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          body_file="$(mktemp)"
          printf '%s' "$PR_BODY" > "$body_file"

          missing=0

          # Required sections
          for heading in "## WHAT CHANGED" "## Testing" "## Risk & Rollback"; do
            if ! grep -qF "$heading" "$body_file"; then
              echo "Thiếu mục bắt buộc: $heading"
              missing=1
            fi
          done

          # WHAT CHANGED must contain at least one change type
          if ! grep -Eq 'New Added|New Removed|New Edited' "$body_file"; then
            echo "Mục WHAT CHANGED phải có ít nhất một trong: New Added, New Removed, New Edited"
            missing=1
          fi

          # Testing and Risk & Rollback are optional, but their headings are required.
          # Rollback may be "None" or empty.

          if [ "$missing" -ne 0 ]; then
            echo "PR description does not follow the required layout."
            exit 1
          fi

          echo "PR description check passed."
