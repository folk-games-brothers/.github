name: check-prs-description

on:
  workflow_call:

permissions:
  contents: read
  pull-requests: read

jobs:
  check-prs-description:
    runs-on: ubuntu-latest
    steps:
      - name: Validate PR template fields
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          set -euo pipefail
          body_file="$(mktemp)"
          printf '%s' "$PR_BODY" > "$body_file"

          missing=0
          for heading in "## WHAT CHANGED" "## Testing" "## Risk & Rollback"; do
            if ! grep -qF "$heading" "$body_file"; then
              echo "Missing required section: $heading"
              missing=1
            fi
          done

          # Require at least one checkbox in Testing or Checklist
          if ! grep -Fq -- '- [ ]' "$body_file" && ! grep -Fq -- '- [x]' "$body_file" && ! grep -Fq -- '- [X]' "$body_file"; then
            echo "Missing required checkbox list."
            missing=1
          fi

          if [ "$missing" -ne 0 ]; then
            echo "PR description does not follow the required template."
            exit 1
          fi

          echo "PR template check passed."
